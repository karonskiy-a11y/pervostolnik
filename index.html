function copyText(txt, btn){
  const box = document.getElementById('copybox');
  const fallback = () => { if (box){ box.hidden = false; box.value = txt; box.focus(); box.select(); } if (btn) btn.textContent = 'Выделено, нажмите Ctrl+C'; };
  try {
    navigator.clipboard.writeText(txt).then(() => { if (btn){ const t = btn.textContent; btn.textContent = 'Скопировано'; setTimeout(() => { btn.textContent = t; }, 2000); } }, fallback);
  } catch (e) { fallback(); }
}
let shareBlob = null;
function shareResult(){
  const txt = resultText();
  const data = {text:txt};
  try {
    if (shareBlob && typeof File === 'function'){
      const f = new File([shareBlob], 'pervostolnik.png', {type:'image/png'});
      if (navigator.canShare && navigator.canShare({files:[f]})) data.files = [f];
    }
    navigator.share(data).catch(err => { if (!err || err.name !== 'AbortError') copyText(txt, document.getElementById('copy')); });
  } catch (e) { copyText(txt, document.getElementById('copy')); }
}
function wrapLines(g, text, maxW){
  const words = text.split(' '), lines = [];
  let line = '';
  words.forEach(w => { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; });
  if (line) lines.push(line);
  return lines;
}
function drawLines(g, text, x, y, maxW, lh, maxLines){
  let lines = wrapLines(g, text, maxW);
  if (maxLines && lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/[ ,.;:]*$/, '') + '…'; }
  lines.forEach(l => { g.fillText(l, x, y); y += lh; });
  return y;
}
function shareCanvas(){
  const W = 1080, H = 1350, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const r = rankOf();
  const F = 'Manrope, "Segoe UI", sans-serif';
  const FD = '"Sofia Sans Extra Condensed", "Arial Narrow", sans-serif';
  const rr = (x, y, w, h, rad) => { g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad); g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); g.fill(); };
  const spacing = v => { try { if ('letterSpacing' in g) g.letterSpacing = v; } catch (e) {} };
  g.fillStyle = '#edf3ef'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#e0e9e3'; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 60){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 60){ g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.save(); g.shadowColor = 'rgba(16,35,27,0.16)'; g.shadowBlur = 44; g.shadowOffsetY = 18; g.fillStyle = '#ffffff'; rr(48, 48, W - 96, H - 96, 44); g.restore();
  g.save(); g.translate(92, 84); g.scale(1.75, 1.75); g.fillStyle = '#0e8a4f'; g.fill(new Path2D(LOGO_PATH));
  g.fillStyle = '#ffffff'; [22, 32, 42].forEach(x => { g.beginPath(); g.arc(x, 29, 3.3, 0, Math.PI * 2); g.fill(); }); g.restore();
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#10231b'; g.font = '900 80px ' + FD; spacing('1px'); g.fillText('ПЕРВОСТОЛЬНИК', 222, 160); spacing('0px');
  g.fillStyle = '#5a6e65'; g.font = '600 27px ' + F;
  g.fillText((S.kind === 'daily' ? 'Смена дня № ' + dayNo() + ' · ' + S.day : S.time === 'night' ? 'Ночная смена' : 'Свободная смена') + ' · ' + MODES[S.mode].name, 224, 202);
  g.fillStyle = S.over ? '#df3f45' : '#0a6b3d'; g.font = '800 34px ' + FD; spacing('5px');
  g.fillText(S.over ? 'СМЕНА ПРЕРВАНА' : 'ДИАГНОЗ СМЕНЫ', 96, 318); spacing('0px');
  g.fillStyle = '#10231b'; g.font = '900 112px ' + FD; spacing('1px');
  let y = drawLines(g, r.title.toUpperCase(), 96, 420, 888, 100, 3); spacing('0px');
  g.fillStyle = '#5a6e65'; g.font = '500 32px ' + F;
  y = drawLines(g, r.text, 96, y + 14, 888, 44, 2);
  const cols = {ok:'#12964f', meh:'#ffd23f', bad:'#df3f45'}, gap = 12;
  const perRow = S.log.length <= 16 ? Math.max(S.log.length, 1) : 14;
  const sz = Math.min(56, Math.floor((888 - gap * (perRow - 1)) / perRow));
  y += 22;
  S.log.forEach((e, i) => { g.fillStyle = cols[e.q]; rr(96 + (i % perRow) * (sz + gap), y + Math.floor(i / perRow) * (sz + gap), sz, sz, 12); });
  y += Math.ceil(S.log.length / perRow) * (sz + gap) + 52;
  const addrWord = S.addr === 'm' ? '«молодым человеком»' : '«девушкой»';
  const stat = (lab, val) => { g.fillStyle = '#5a6e65'; g.font = '600 29px ' + F; g.fillText(lab, 96, y); g.fillStyle = '#10231b'; g.font = '800 38px ' + FD; g.fillText(val, 984 - g.measureText(val).width, y); y += 48; };
  stat('Касса', rub(S.cash) + ' из ' + nf.format(planOf()));
  stat('Доверие · нервы', S.trust + ' · ' + S.nerves);
  stat('Очередь, максимум', S.maxQueue + ' чел.');
  stat('Назвали ' + addrWord, S.addrCount + ' ' + plural(S.addrCount, ['раз','раза','раз']));
  const room = Math.min(3, Math.floor((H - 150 - (y + 78)) / 42) + 1);
  g.font = 'italic 500 31px ' + F;
  const fits = room < 1 ? [] : S.deck.slice(0, S.step + 1).filter(id => THINK[id]).map(id => { const t = fill(THINK[id]); return t.charAt(0) === '«' ? t : '«' + t + '»'; }).filter(t => wrapLines(g, t, 888).length <= room);
  if (fits.length){
    const quote = fits[Math.floor(Math.random() * fits.length)];
    g.fillStyle = '#fff5cc'; rr(96, y + 2, 176, 42, 21);
    g.fillStyle = '#2a2206'; g.font = '800 26px ' + FD; spacing('3px'); g.fillText('ПРО СЕБЯ', 116, y + 31); spacing('0px');
    g.fillStyle = '#10231b'; g.font = 'italic 500 31px ' + F;
    drawLines(g, quote, 96, y + 88, 888, 42, room);
  }
  g.fillStyle = '#0e8a4f'; g.font = '700 28px ' + F;
  g.fillText(SHARE_URL.replace(/^https?:\/\//, '').replace(/\/$/, ''), 96, H - 94);
  return c;
}
function drawShare(){
  const go = () => {
    try {
      const c = shareCanvas();
      const url = c.toDataURL('image/png');
      const img = document.getElementById('shareimg');
      if (!img) return;
      img.src = url; img.hidden = false;
      const hint = document.getElementById('sharehint'); if (hint) hint.hidden = false;
      const dl = document.getElementById('dl'); if (dl) dl.href = url;
      if (c.toBlob) c.toBlob(b => { shareBlob = b; });
    } catch (e) {}
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go, go); else go();
}

function footNote(){
  return '<p class="foot">Аптека, персонажи и бренды вымышлены. Справки опираются на действующие нормы РФ: приказы Минздрава № 1094н и № 259н, постановление Правительства № 2463, КоАП, Трудовой кодекс. Это игра, а не медицинская или юридическая консультация.</p>';
}

function render(fresh){
  clearTimer();
  document.documentElement.classList.toggle('night', !!(S && S.time === 'night'));
  if (!S) return renderStart();
  if (S.phase === 'end') return renderEnd();
  renderGame(fresh);
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !S || S.phase !== 'play') return;
  if (!/^[1-4]$/.test(e.key)) return;
  const k = +e.key - 1;
  if (!S.mini){ const ci = S.order[k]; if (ci !== undefined){ e.preventDefault(); chooseCard(ci); } return; }
  if (S.mini.k === 'hand' && k < 4){ e.preventDefault(); handAnswer(k); }
  if (S.mini.k === 'rush' && S.mini.started && k < 4){ e.preventDefault(); rushAnswer(k); }
});

/* Сохранение партии при обновлении страницы у открытых зрителей */
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({S:S})); } catch (e) {}
function boot(data){ if (data && data.S && data.S.deck) S = data.S; render(); }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
