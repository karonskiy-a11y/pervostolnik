<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Браузерная игра про смену фармацевта первого стола в российской аптеке: рецепты, аналоги по МНН, маркировка, возвраты и Росздравнадзор.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='2' width='10' height='28' rx='2' fill='%23087a45'/%3E%3Crect x='2' y='11' width='28' height='10' rx='2' fill='%23087a45'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>Первостольник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Раскладка: вид из-за первого стола. Кафельная стена, табло показателей, покупатель у окошка, каждое решение пробивается чеком. */
:root{
  --bg:#e8efec; --grout:#d6e1dc; --glow-bg:rgba(8,122,69,0);
  --surface:#ffffff; --surface-2:#f2f7f4;
  --ink:#13211c; --muted:#52655c; --line:#cad8d1;
  --cross:#087a45; --cross-ink:#ffffff; --cross-glow:rgba(8,122,69,0);
  --stamp:#4a3aa8;
  --good:#18794a; --warn:#a86b00; --bad:#bf3326;
  /* бумага (рецепт, чек) светлая в обеих темах: это физический предмет */
  --paper:#fbfaf3; --paper-ink:#1c1d1a; --paper-muted:#6a695f; --paper-line:#cfccbc;
  --paper-good:#17703f; --paper-bad:#b3261e; --pen:#1f3a93; --paper-stamp:#4b36b0;
  /* экран сканера тёмный в обеих темах */
  --lcd-bg:#0e1913; --lcd-ink:#9ef0bf; --lcd-bad:#ff7b6b;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a120f; --grout:#111d18; --glow-bg:rgba(55,217,135,.13);
    --surface:#111c18; --surface-2:#172520;
    --ink:#e1eee8; --muted:#8ea79c; --line:#253731;
    --cross:#37d987; --cross-ink:#05200f; --cross-glow:rgba(55,217,135,.55);
    --stamp:#ab9fff;
    --good:#52d18d; --warn:#f0b43c; --bad:#ff6f5f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a120f; --grout:#111d18; --glow-bg:rgba(55,217,135,.13);
  --surface:#111c18; --surface-2:#172520;
  --ink:#e1eee8; --muted:#8ea79c; --line:#253731;
  --cross:#37d987; --cross-ink:#05200f; --cross-glow:rgba(55,217,135,.55);
  --stamp:#ab9fff;
  --good:#52d18d; --warn:#f0b43c; --bad:#ff6f5f;
  color-scheme:dark;
}

body{
  background-color:var(--bg);
  background-image:
    radial-gradient(56rem 24rem at 10% -5rem, var(--glow-bg), transparent 70%),
    linear-gradient(var(--grout) 1px, transparent 1px),
    linear-gradient(90deg, var(--grout) 1px, transparent 1px);
  background-size:auto, 46px 46px, 46px 46px;
  color:var(--ink);
  font:400 16px/1.5 var(--f-body);
}
.wrap{max-width:780px; margin:0 auto; padding-inline:16px; padding-block:18px 44px; display:grid; gap:16px}
button{font:inherit}

/* Вывеска и часы */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.sign{display:flex; align-items:center; gap:12px; min-width:0}
.cross{--s:34px; width:var(--s); height:var(--s); position:relative; flex:none}
.cross::before,.cross::after{content:""; position:absolute; background:var(--cross); border-radius:3px; box-shadow:0 0 14px var(--cross-glow), 0 0 34px var(--cross-glow)}
.cross::before{left:32%; width:36%; top:0; height:100%}
.cross::after{top:32%; height:36%; left:0; width:100%}
.sign-name{font:800 14px/1 var(--f-display); letter-spacing:.14em; text-transform:uppercase}
.sign-sub{font:500 12px/1.3 var(--f-mono); color:var(--muted); margin-top:6px}
.clock{text-align:right; font-family:var(--f-mono)}
.clock b{display:block; font-size:26px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.clock span{font-size:12px; color:var(--muted)}
.steps{display:flex; gap:4px}
.steps i{flex:1; height:4px; border-radius:2px; background:var(--line)}
.steps i.done{background:var(--cross)}
.steps i.now{background:var(--ink)}

/* Табло показателей */
.meters{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:640px){ .meters{grid-template-columns:repeat(2,minmax(0,1fr))} }
.meter{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px 12px; min-width:0}
.meter .lab{font:600 11px/1.2 var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.meter .val{font:700 19px/1.2 var(--f-mono); font-variant-numeric:tabular-nums; margin-top:4px; white-space:nowrap}
.meter .val small{font-size:11px; font-weight:400; color:var(--muted); margin-left:4px}
.bar{height:6px; border-radius:3px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--cross); transition:width .5s ease}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}
.pop{position:absolute; right:10px; top:9px; font:700 12px var(--f-mono); pointer-events:none; animation:pop 1.8s ease-out forwards}
.pop.up{color:var(--good)} .pop.down{color:var(--bad)}
@keyframes pop{0%{transform:translateY(5px); opacity:0} 15%{opacity:1; transform:none} 75%{opacity:1} 100%{opacity:0; transform:translateY(-8px)}}

/* Покупатель у окошка */
.visit{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; display:grid; gap:16px; animation:arrive .35s ease-out}
@keyframes arrive{from{transform:translateY(10px); opacity:.35} to{transform:none; opacity:1}}
.who{display:flex; align-items:center; gap:14px}
.ava{width:78px; height:78px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; flex:none}
.ava svg{width:100%; height:100%; display:block}
.who-text{min-width:0; display:grid; gap:4px}
.who-name{font:600 18px/1.2 var(--f-body)}
.who-role{font-size:14px; line-height:1.35; color:var(--muted)}
.tag{justify-self:start; font:600 10.5px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--stamp); border:1px solid currentColor; border-radius:999px; padding:4px 8px}
.say{margin:0; font:500 clamp(18px,2.6vw,21px)/1.45 var(--f-body); text-wrap:pretty; max-width:62ch}
.say.q::before{content:"«"} .say.q::after{content:"»"}
.say.narr{font-weight:400; color:var(--muted)}

.choices{display:grid; gap:8px}
.choice{display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font:500 15.5px/1.4 var(--f-body); cursor:pointer; transition:border-color .15s, transform .12s}
.choice:hover{border-color:var(--cross)}
.choice:active{transform:scale(.995)}
.choice:focus-visible{outline:2px solid var(--cross); outline-offset:2px}
.choice kbd{font:600 12px/1 var(--f-mono); min-width:24px; height:24px; display:grid; place-items:center; border:1px solid var(--line); border-radius:6px; color:var(--muted); background:var(--surface); flex:none}
.picked{font-size:15px; color:var(--muted); margin:0; display:flex; gap:8px; align-items:baseline}
.picked b{color:var(--ink); font-weight:600}
.picked span{font:600 11px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; flex:none}

/* Рецептурный бланк */
.rx{background:var(--paper); color:var(--paper-ink); border:1px solid var(--paper-line); border-radius:4px; padding:14px 16px 12px; max-width:440px; font:400 11.5px/1.35 var(--f-body); transform:rotate(-.6deg); box-shadow:0 3px 12px rgba(0,0,0,.1)}
.rx-top{display:flex; justify-content:space-between; gap:10px; color:var(--paper-muted); font-size:10px}
.rx-title{font:700 13px var(--f-mono); letter-spacing:.35em; text-align:center; margin:8px 0 6px}
.rx-row{display:flex; gap:8px; align-items:baseline; border-bottom:1px solid var(--paper-line); padding:3px 0; min-width:0}
.rx-row span{color:var(--paper-muted); flex:none}
.hand{font-family:var(--f-hand); color:var(--pen); font-size:21px; line-height:1.05; font-weight:500}
.rx-rp{padding:8px 0 2px; font-size:22px; line-height:1.15}
.rx-rp s{text-decoration-thickness:2px}
.rx-foot{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-top:4px}
.rx-foot .hand{font-size:24px}
.stamp{border:2px solid var(--paper-stamp); color:var(--paper-stamp); border-radius:50%; width:76px; height:76px; display:grid; place-items:center; text-align:center; font:700 8px/1.25 var(--f-mono); transform:rotate(-14deg); opacity:.82; flex:none; padding:6px}
.rx-valid{font-size:10px; color:var(--paper-muted); margin-top:6px}

/* Экран сканера */
.scan{background:var(--lcd-bg); color:var(--lcd-ink); font:500 12.5px/1.6 var(--f-mono); border-radius:10px; padding:12px 14px; max-width:440px; border:1px solid rgba(0,0,0,.4); overflow-x:auto}
.scan .bad{color:var(--lcd-bad); font-weight:700; animation:blink 1s steps(2) 4}
@keyframes blink{50%{opacity:.25}}

/* Чек */
.slip{display:grid; filter:drop-shadow(0 8px 16px rgba(0,0,0,.16))}
.receipt{justify-self:center; width:100%; max-width:540px; background:var(--paper); color:var(--paper-ink); font:400 13.5px/1.5 var(--f-mono); padding:18px 18px 32px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
  animation:print .5s ease-out}
@keyframes print{from{clip-path:inset(0 0 55% 0)} to{clip-path:inset(0 0 0 0)}}
.r-head{text-align:center; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:12px; line-height:1.6}
.r-hr{border:0; border-top:1px dashed var(--paper-line); margin:12px 0}
.r-story{font:400 15.5px/1.5 var(--f-body); margin:0}
.r-line{display:flex; justify-content:space-between; gap:12px}
.r-line .v{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
.v.up{color:var(--paper-good)} .v.down{color:var(--paper-bad)}
.r-fact{font:400 14px/1.5 var(--f-body)}
.r-fact b{display:block; font:700 11px/1.4 var(--f-mono); letter-spacing:.12em; color:var(--paper-stamp); margin-bottom:4px}
.r-alert{font-weight:700; color:var(--paper-bad); text-align:center; letter-spacing:.06em}
.actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center}

.btn{font:700 15px/1 var(--f-display); letter-spacing:.02em; background:var(--cross); color:var(--cross-ink); border:0; border-radius:12px; padding:16px 24px; cursor:pointer; transition:transform .12s, box-shadow .2s; box-shadow:0 6px 20px -8px var(--cross-glow)}
.btn:hover{transform:translateY(-1px); box-shadow:0 8px 26px -6px var(--cross-glow), 0 4px 10px -6px rgba(0,0,0,.3)}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; font-size:13px}

/* Заставка */
.intro{display:grid; gap:18px; padding-block:22px 6px}
.intro .cross{--s:58px; animation:neon 1.8s steps(1) 1}
@keyframes neon{0%{opacity:.25} 8%{opacity:1} 12%{opacity:.3} 18%{opacity:1} 24%{opacity:.5} 30%,100%{opacity:1}}
.eyebrow{margin:0; font:600 12px/1.3 var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--cross)}
.intro h1{margin:0; font:800 clamp(29px,8.2vw,70px)/1 var(--f-display); letter-spacing:-.02em; text-wrap:balance}
.lede{margin:0; font-size:18px; line-height:1.5; max-width:60ch}
.legend{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (max-width:540px){ .legend{grid-template-columns:1fr} }
.legend div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.legend b{display:block; font:700 11.5px/1.3 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px}
.legend p{margin:0; font-size:14.5px; color:var(--muted)}
.rules{margin:0; color:var(--muted); max-width:62ch}
.intro .actions{justify-content:flex-start}
.best{font:500 13px var(--f-mono); color:var(--muted)}

/* Итог */
.rank{display:grid; gap:10px; text-align:center; padding-block:8px}
.rank h2{margin:0; font:800 clamp(24px,6.2vw,46px)/1.1 var(--f-display); text-wrap:balance}
.rank p{margin:0 auto; max-width:52ch; color:var(--muted); font-size:16.5px}
.rank .eyebrow.over{color:var(--bad)}
.log{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.log li{display:grid; grid-template-columns:auto auto minmax(0,1fr); gap:8px; align-items:start}
.log .m{font-weight:700}
.log .m.ok{color:var(--paper-good)} .log .m.bad{color:var(--paper-bad)} .log .m.meh{color:var(--paper-muted)}
.log small{display:block; color:var(--paper-muted); font-size:12px; line-height:1.4}
.big{font-size:15px; font-weight:700}
#copybox{width:100%; max-width:540px; justify-self:center; min-height:92px; font:13px/1.5 var(--f-mono); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px}

.foot{margin:6px 0 0; font-size:12.5px; line-height:1.5; color:var(--muted); max-width:72ch}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
(function(){
'use strict';

const PLAN = 8000;
const SHIFT_NO = 214;
const START = {cash:0, trust:50, nerves:80, risk:10};
const INSPECT_AT = 55;

const today = new Date();
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
const daysAgo = n => { const d = new Date(today); d.setDate(d.getDate() - n); return fmtDate(d); };
const nf = new Intl.NumberFormat('ru-RU');
const rub = n => (n < 0 ? '−' : '') + nf.format(Math.abs(n)) + ' ₽';
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + nf.format(Math.abs(n));
const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
function plural(n, f){ const a = Math.abs(n) % 100, b = a % 10; if (a > 10 && a < 20) return f[2]; if (b > 1 && b < 5) return f[1]; if (b === 1) return f[0]; return f[2]; }
function shuffle(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Портреты ---------- */
const SK = ['#f3cfae', '#e3b08b', '#c78f6b'];
const EYE = '#23201d', LIP = '#6b3b2e';
function fig(x, y, s, skin, hair, top, mood){
  const mouth = mood === 'angry' ? '<path d="M-4 6 L4 6" stroke="'+LIP+'" stroke-width="1.6" stroke-linecap="round"/>' : '<path d="M-4 6 Q0 8 4 6" stroke="'+LIP+'" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
  const brows = mood === 'angry' ? '<path d="M-8 -4 L-2 -2 M8 -4 L2 -2" stroke="'+EYE+'" stroke-width="1.5"/>' : '';
  return '<g transform="translate('+x+' '+y+') scale('+s+')">' +
    '<path d="M-22 42 Q-22 17 0 15 Q22 17 22 42Z" fill="'+top+'"/>' +
    '<circle cx="0" cy="0" r="12.5" fill="'+skin+'"/>' +
    '<path d="M-12.5 -1 Q-12.5 -14 0 -14 Q12.5 -14 12.5 -1 Q7 -8 0 -8 Q-7 -8 -12.5 -1Z" fill="'+hair+'"/>' +
    '<circle cx="-4.5" cy="1" r="1.4" fill="'+EYE+'"/><circle cx="4.5" cy="1" r="1.4" fill="'+EYE+'"/>' + brows + mouth + '</g>';
}
function avatar(a){
  if (a.item === 'lunch'){
    const grains = [[34,44],[40,40],[47,38],[54,39],[61,41],[67,45],[38,45],[45,43],[52,43],[59,44],[44,47],[56,47]]
      .map(p => '<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="1.6" ry="1.1" fill="#5e3a1d"/>').join('');
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<path d="M40 30 Q36 24 40 18 M50 28 Q46 22 50 15 M60 30 Q56 24 60 18" fill="none" stroke-width="2" stroke-linecap="round" style="stroke:var(--muted)" opacity=".6"/>' +
      '<path d="M24 52 Q50 30 76 52Z" fill="#8a5a34"/>' + grains +
      '<rect x="20" y="48" width="60" height="30" rx="8" fill="#cfe3ec"/>' +
      '<rect x="20" y="48" width="60" height="30" rx="8" fill="none" stroke="#6f8e9c" stroke-width="2"/>' +
      '<path d="M74 22 L64 50" stroke="#8b9499" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M71 16 L74 23 M75 15 L76.5 22.5 M79 16 L78 23.5" stroke="#8b9499" stroke-width="2" stroke-linecap="round"/>' +
      '</svg>';
  }
  if (a.item === 'crowd'){
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      fig(26, 50, .85, SK[1], '#4a3426', '#6b7d8f', 'flat') +
      fig(74, 48, .85, SK[0], '#b9b9b9', '#9b5b6f', 'flat') +
      fig(50, 60, 1.15, SK[0], '#2b2320', '#3d6b5c', 'angry') + '</svg>';
  }
  const skin = SK[a.s || 0];
  const st = a.st;
  const small = st === 'scarf';
  let s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
  if (st === 'long') s += '<path d="M29 46 Q27 18 50 17 Q73 18 71 46 L75 76 Q50 82 25 76Z" fill="'+a.hair+'"/>';
  if (st === 'hood') s += '<path d="M24 62 Q22 14 50 13 Q78 14 76 62 Q76 76 50 78 Q24 76 24 62Z" fill="'+a.top+'"/>';
  if (st === 'scarf') s += '<path d="M27 54 Q25 15 50 14 Q75 15 73 54 Q71 71 50 74 Q29 71 27 54Z" fill="'+a.scarf+'"/>';
  s += '<path d="M14 100 Q14 73 50 71 Q86 73 86 100Z" fill="'+a.top+'"/>';
  if (a.coat) s += '<path d="M38 73 L50 90 L62 73" fill="none" stroke="#b7bdb6" stroke-width="2"/><circle cx="50" cy="94" r="1.5" fill="#b7bdb6"/>';
  s += '<rect x="43" y="57" width="14" height="16" rx="4" fill="'+skin+'"/><rect x="43" y="57" width="14" height="16" rx="4" fill="#000" opacity=".08"/>';
  if (!small && st !== 'hood') s += '<circle cx="32" cy="47" r="4" fill="'+skin+'"/><circle cx="68" cy="47" r="4" fill="'+skin+'"/>';
  s += '<ellipse cx="50" cy="'+(small ? 47 : 45)+'" rx="'+(small ? 15.5 : 18)+'" ry="'+(small ? 18.5 : 21)+'" fill="'+skin+'"/>';
  switch (st){
    case 'short': s += '<path d="M31 43 Q30 21 50 21 Q70 21 69 43 Q64 30 50 30 Q36 30 31 43Z" fill="'+a.hair+'"/>'; break;
    case 'long':  s += '<path d="M32 42 Q32 22 50 22 Q68 22 68 42 Q60 29 50 30 Q40 31 32 42Z" fill="'+a.hair+'"/>'; break;
    case 'bun':   s += '<circle cx="50" cy="19" r="8.5" fill="'+a.hair+'"/><path d="M32 42 Q31 22 50 22 Q69 22 68 42 Q62 31 50 31 Q38 31 32 42Z" fill="'+a.hair+'"/>'; break;
    case 'bald':  s += '<path d="M31 46 Q30 37 35 33 L36 47Z M69 46 Q70 37 65 33 L64 47Z" fill="'+a.hair+'"/>'; break;
    case 'cap':   s += '<path d="M31 41 Q31 20 50 20 Q69 20 69 41Z" fill="'+a.cap+'"/><path d="M52 38 Q72 35 82 41 Q72 43 52 41Z" fill="'+a.cap+'"/><path d="M31 41 L69 41" stroke="#000" stroke-opacity=".18" stroke-width="2"/>'; break;

Object.keys(CARDS).forEach(k => { CARDS[k].id = k; });

function fineOf(s){ return s.risk < 40 ? 0 : Math.round((s.risk - 30) * 300 / 500) * 500; }
function found(s){
  const n = s.log.filter(e => e.q === 'bad').length;
  return n ? 'Нашли ' + n + ' ' + plural(n, ['нарушение','нарушения','нарушений']) + '.' : 'Нашли пару недочётов в журналах.';
}

/* ---------- Состояние ---------- */
let S = null;

function newShift(){
  const pool = shuffle(Object.keys(CARDS).filter(id => !CARDS[id].fixed)).slice(0, 10);
  S = {
    phase:'play', step:0,
    deck:['davlenie'].concat(pool.slice(0, 4), ['lunch'], pool.slice(4)),
    cash:START.cash, trust:START.trust, nerves:START.nerves, risk:START.risk,
    fines:0, log:[], inspected:false, over:null, last:null, saved:false, newBest:false
  };
  S.order = shuffle(CARDS[S.deck[0]].choices.map((_, i) => i));
  render(true);
}

function clockAt(step){
  const mins = 480 + Math.round(step * 720 / S.deck.length / 5) * 5;
  return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60);
}

function choose(ci){
  if (!S || S.phase !== 'play') return;
  const card = CARDS[S.deck[S.step]];
  const ch = card.choices[ci];
  const res = ch.dyn ? ch.dyn(S) : {out:ch.out, d:ch.d, q:ch.q};
  const d = res.d || {};
  const b = {cash:S.cash, trust:S.trust, nerves:S.nerves, risk:S.risk};
  S.cash += d.c || 0;
  S.trust = clamp(S.trust + (d.t || 0));
  S.nerves = clamp(S.nerves + (d.n || 0));
  S.risk = clamp(S.risk + (d.r || 0));
  if (res.fine) S.fines += res.fine;
  S.log.push({who:card.who, label:ch.label, q:res.q, time:clockAt(S.step)});
  S.last = {out:res.out, ci:ci, fact:card.fact, d:{c:S.cash - b.cash, t:S.trust - b.trust, n:S.nerves - b.nerves, r:S.risk - b.risk}};
  if (S.risk >= 100) S.over = 'license';
  else if (S.trust <= 0) S.over = 'trust';
  else if (S.nerves <= 0) S.over = 'nerves';
  if (!S.over && !S.inspected && card.id !== 'inspection' && S.risk >= INSPECT_AT){
    S.inspected = true;
    S.deck.splice(S.step + 1, 0, 'inspection');
  }
  S.phase = 'result';
  render();
}

function next(){
  if (!S) return;
  if (S.over || S.step >= S.deck.length - 1){ S.phase = 'end'; saveBest(); render(true); return; }
  S.step++;
  S.order = shuffle(CARDS[S.deck[S.step]].choices.map((_, i) => i));
  S.phase = 'play';
  S.last = null;
  render(true);
}

  license:{title:'Работу аптеки приостановили', text:'Нарушений набралось столько, что Росздравнадзор пришёл надолго. За грубые нарушения аптеке грозит крупный штраф или приостановка работы до 90 суток.'},
  trust:{title:'Район объявил вам бойкот', text:'Рейтинг на картах упал до 1,3 звезды. Бабушки у подъезда советуют аптеку через дорогу, и все их слушают.'},
  nerves:{title:'Больничный посреди смены', text:'Нервы закончились раньше смены. Заведующая сама встала за первый стол и впервые за десять лет вспомнила, как это тяжело.'}
};
function rankOf(){
  if (S.over) return OVER[S.over];
  const planOk = S.cash >= PLAN;
  if (planOk && S.trust >= 65 && S.risk < 50) return {title:'Фармацевт месяца', text:'План выполнен, покупатели довольны, проверки не страшны. Ваше фото висит у входа, рядом с огнетушителем.'};
  if (S.risk >= 60) return {title:'Постоянный клиент Росздравнадзора', text:'Инспекторы знают вас по имени и уже не представляются. Касса полная, архив рецептов опасный.'};
  if (planOk && S.trust < 45) return {title:'Машина допродаж', text:'Региональный менеджер ставит вас в пример. Покупатели ставят одну звезду. Все при деле.'};
  if (S.trust >= 70 && S.risk < 40) return {title:'Фармацевт, к которому ходят по имени', text:'План не добран, зато в очереди спрашивают: «А этот фармацевт сегодня работает?» Лучшая реклама аптеки.'};
  if (S.nerves <= 20) return {title:'Выжаты до последней капли', text:'Смена закрыта, но домой вы едете, глядя в одну точку. Возьмите выходной.'};
  return {title:'Крепкий первостольник', text:'Без подвигов и без катастроф. Касса сошлась, совесть почти тоже.'};
}
function score(){ return Math.max(0, Math.round(S.cash / 100 + S.trust + S.nerves / 2 - S.risk - (S.over ? 50 : 0))); }
function loadBest(){ try { return JSON.parse(localStorage.getItem('pervostolnik-best') || 'null'); } catch (e) { return null; } }
function saveBest(){
  if (S.saved) return; S.saved = true;
  const sc = score(), b = loadBest();
  if (!b || sc > b.score){
    S.newBest = !!b;
    try { localStorage.setItem('pervostolnik-best', JSON.stringify({score:sc, title:rankOf().title})); } catch (e) {}
  }
}

/* ---------- Отрисовка ---------- */
const app = document.getElementById('app');
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function header(){
  const done = S && S.phase === 'end';
  const time = !S ? '08:00' : done ? (S.over ? clockAt(S.step) : '20:00') : clockAt(S.step);
  const sub = !S ? 'смена ещё не началась' : done ? (S.over ? 'смена прервана' : 'смена закрыта') : 'визит ' + (S.step + 1) + ' из ' + S.deck.length;
  let steps = '';
  if (S){
    steps = '<div class="steps" aria-hidden="true">' + S.deck.map((_, i) => '<i class="' + (done || i < S.step || (i === S.step && S.phase === 'result') ? 'done' : i === S.step ? 'now' : '') + '"></i>').join('') + '</div>';
  }
  return '<header class="top"><div class="sign"><div class="cross" aria-hidden="true"></div><div><div class="sign-name">Аптека у метро</div><div class="sign-sub">Смена № ' + SHIFT_NO + ' · ' + fmtDate(today) + '</div></div></div>' +
    '<div class="clock"><b>' + time + '</b><span>' + sub + '</span></div></header>' + steps;
}

function meters(d){
  const lvl = (v, lo, hi, inverse) => inverse ? (v >= hi ? 'bad' : v >= lo ? 'warn' : '') : (v < lo ? 'bad' : v < hi ? 'warn' : '');
  const list = [
    {lab:'Касса', val:rub(S.cash), sub:'из ' + nf.format(PLAN), pct:clamp(S.cash / PLAN * 100), cls:'', dv:d && d.c, good:v => v > 0, fmt:v => sgn(v) + ' ₽'},
    {lab:'Доверие', val:S.trust, sub:'/100', pct:S.trust, cls:lvl(S.trust, 25, 45), dv:d && d.t, good:v => v > 0, fmt:sgn},
    {lab:'Нервы', val:S.nerves, sub:'/100', pct:S.nerves, cls:lvl(S.nerves, 20, 40), dv:d && d.n, good:v => v > 0, fmt:sgn},
    {lab:'Риск проверки', val:S.risk, sub:'/100', pct:S.risk, cls:lvl(S.risk, 40, 70, true), dv:d && d.r, good:v => v < 0, fmt:sgn}
  ];
  return '<section class="meters" aria-label="Показатели смены">' + list.map(m =>
    '<div class="meter"><div class="lab">' + m.lab + '</div><div class="val">' + m.val + '<small>' + m.sub + '</small></div>' +
    '<div class="bar"><i class="' + m.cls + '" style="width:' + m.pct + '%"></i></div>' +
    (m.dv ? '<span class="pop ' + (m.good(m.dv) ? 'up' : 'down') + '" aria-hidden="true">' + m.fmt(m.dv) + '</span>' : '') +
    '</div>').join('') + '</section>';
}

function whoBlock(card){
  const prop = card.prop ? card.prop() : '';
  return '<div class="who"><div class="ava">' + avatar(card.av) + '</div><div class="who-text"><span class="tag">' + card.tag + '</span><div class="who-name">' + card.who + '</div><div class="who-role">' + card.role + '</div></div></div>' +
    '<p class="say ' + (card.narr ? 'narr' : 'q') + '">' + card.say + '</p>' + prop;
}

function slip(card){
  const L = S.last, d = L.d;
  const rows = [];
  if (d.c) rows.push(['Касса', sgn(d.c) + ' ₽', d.c > 0]);
  if (d.t) rows.push(['Доверие', sgn(d.t), d.t > 0]);
  if (d.n) rows.push(['Нервы', sgn(d.n), d.n > 0]);
  if (d.r) rows.push(['Риск проверки', sgn(d.r), d.r < 0]);
  const lines = rows.length ? rows.map(r => '<div class="r-line"><span>' + r[0] + '</span><span class="v ' + (r[2] ? 'up' : 'down') + '">' + r[1] + '</span></div>').join('') : '<div class="r-line"><span>Показатели</span><span class="v">без изменений</span></div>';
  const alert = S.over ? '<hr class="r-hr"><div class="r-alert">СМЕНА ПРЕРВАНА</div>' : '';
  const insp = S.inspected && card.id !== 'inspection' && S.deck[S.step + 1] === 'inspection' && !S.over ? '<hr class="r-hr"><div class="r-alert">В ДВЕРЯХ ЧЕЛОВЕК С ПАПКОЙ</div>' : '';
  return '<div class="slip"><div class="receipt" role="status">' +
    '<div class="r-head">Аптека у метро<br>Кассовый чек · визит ' + (S.step + 1) + ' · ' + clockAt(S.step) + '</div><hr class="r-hr">' +
    '<p class="r-story">' + L.out + '</p><hr class="r-hr">' + lines +
    '<hr class="r-hr"><div class="r-fact"><b>СПРАВКА</b>' + L.fact + '</div>' + insp + alert +
    '</div></div>';
}

function renderStart(){
  const best = loadBest();
  app.innerHTML =
    '<section class="intro">' +
      '<div class="cross" aria-hidden="true"></div>' +
      '<p class="eyebrow">Симулятор смены в российской аптеке</p>' +
      '<h1>Первостольник</h1>' +
      '<p class="lede">Вы фармацевт первого стола в аптеке у метро. Впереди двенадцать визитов: «белые круглые от давления», антибиотик «мне всегда без рецепта давали», тайный покупатель и заведующая с планом по БАДам.</p>' +
      '<div class="legend">' +
        '<div><b>Касса</b><p>План на смену 8 000 ₽. Честный совет обычно приносит меньше, чем допродажа.</p></div>' +
        '<div><b>Доверие</b><p>Упадёт до нуля, и район уйдёт в аптеку напротив.</p></div>' +
        '<div><b>Нервы</b><p>Закончатся раньше смены, и вы уйдёте на больничный.</p></div>' +
        '<div><b>Риск проверки</b><p>Растёт от каждого нарушения. Рано или поздно придёт Росздравнадзор.</p></div>' +
      '</div>' +
      '<p class="rules">Каждое решение касса пробивает чеком со справкой: какое правило здесь действует на самом деле. В конце смены вас ждут Z-отчёт и звание. Отвечать можно клавишами 1, 2, 3.</p>' +
      '<div class="actions"><button class="btn" id="go" type="button">Открыть окошко</button>' +
      (best ? '<span class="best">Лучшая смена: ' + best.score + ' ' + plural(best.score, ['балл','балла','баллов']) + ' · «' + best.title + '»</span>' : '') + '</div>' +
    '</section>' + footNote();
  document.getElementById('go').addEventListener('click', newShift);
}

function renderGame(fresh){
  const card = CARDS[S.deck[S.step]];
  let body;
  if (S.phase === 'play'){
    body = '<div class="choices" role="group" aria-label="Варианты ответа">' + S.order.map((ci, k) =>
      '<button class="choice" type="button" data-ci="' + ci + '"><kbd>' + (k + 1) + '</kbd><span>' + card.choices[ci].label + '</span></button>').join('') + '</div>';
  } else {
    const last = S.step >= S.deck.length - 1;
    const btn = S.over ? 'Закрыть смену' : last ? 'Закрыть смену · Z-отчёт' : 'Следующий!';
    body = '<p class="picked" id="picked"><span>Ваш ответ</span><b>' + card.choices[S.last.ci].label + '</b></p>' + slip(card) +
      '<div class="actions"><button class="btn" id="next" type="button">' + btn + '</button></div>';
  }
  app.innerHTML = header() + meters(S.phase === 'result' ? S.last.d : null) +
    '<article class="visit"' + (S.phase === 'result' ? ' style="animation:none"' : '') + '>' + whoBlock(card) + body + '</article>' + footNote();
  if (S.phase === 'play'){
    app.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => choose(+b.dataset.ci)));
    if (fresh) window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'});
  } else {
    const nb = document.getElementById('next');
    nb.addEventListener('click', next);
    nb.focus({preventScroll:true});
    const p = document.getElementById('picked');
    if (p && p.getBoundingClientRect().top > window.innerHeight * 0.55) p.scrollIntoView({block:'start', behavior: reduce ? 'auto' : 'smooth'});
  }
}

function renderEnd(){
  const r = rankOf();
  const ok = S.log.filter(e => e.q === 'ok').length, bad = S.log.filter(e => e.q === 'bad').length, meh = S.log.length - ok - bad;
  const pct = Math.max(0, Math.round(S.cash / PLAN * 100));
  const mark = {ok:'✓', bad:'✕', meh:'~'};
  const endTime = S.over ? clockAt(S.step) : '20:00';
  const log = S.log.map(e => '<li><span>' + e.time + '</span><span class="m ' + e.q + '">' + mark[e.q] + '</span><span>' + e.who + '<small>' + e.label + '</small></span></li>').join('');
  const sc = score();
  app.innerHTML = header() +
    '<section class="rank">' +
      '<p class="eyebrow' + (S.over ? ' over' : '') + '">' + (S.over ? 'Смена прервана' : 'Итог смены') + '</p>' +
      '<h2>' + r.title + '</h2><p>' + r.text + '</p>' +
    '</section>' +
    '<div class="slip"><div class="receipt">' +
      '<div class="r-head">Аптека у метро<br>Отчёт о закрытии смены (Z)<br>Смена № ' + SHIFT_NO + ' · ' + fmtDate(today) + ' ' + endTime + '</div><hr class="r-hr">' +
      '<div class="r-line"><span>Визитов обслужено</span><span class="v">' + S.log.length + '</span></div>' +
      '<div class="r-line"><span>Выручка</span><span class="v">' + rub(S.cash) + '</span></div>' +
      '<div class="r-line"><span>План</span><span class="v">' + rub(PLAN) + '</span></div>' +
      '<div class="r-line"><span>Выполнение плана</span><span class="v ' + (pct >= 100 ? 'up' : 'down') + '">' + pct + ' %</span></div>' +
      '<div class="r-line"><span>В том числе штрафы</span><span class="v' + (S.fines ? ' down' : '') + '">' + rub(-S.fines) + '</span></div>' +
      '<div class="r-line"><span>Доверие района</span><span class="v">' + S.trust + ' / 100</span></div>' +
      '<div class="r-line"><span>Нервы</span><span class="v">' + S.nerves + ' / 100</span></div>' +
      '<div class="r-line"><span>Риск проверки</span><span class="v">' + S.risk + ' / 100</span></div>' +
      '<hr class="r-hr"><div class="r-head">Журнал решений</div><hr class="r-hr">' +
      '<ol class="log">' + log + '</ol><hr class="r-hr">' +
      '<div class="r-line"><span>✓ по правилам</span><span class="v">' + ok + '</span></div>' +
      '<div class="r-line"><span>~ спорно</span><span class="v">' + meh + '</span></div>' +
      '<div class="r-line"><span>✕ нарушения</span><span class="v' + (bad ? ' down' : '') + '">' + bad + '</span></div>' +
      '<hr class="r-hr"><div class="r-line big"><span>ИТОГОВЫЙ БАЛЛ</span><span class="v">' + sc + '</span></div>' +
      (S.newBest ? '<div class="r-head" style="margin-top:8px">Новый рекорд</div>' : '') +
    '</div></div>' +
    '<div class="actions"><button class="btn" id="again" type="button">Новая смена</button><button class="btn ghost" id="copy" type="button">Скопировать результат</button></div>' +
    '<textarea id="copybox" readonly hidden aria-label="Текст результата"></textarea>' + footNote();
  document.getElementById('again').addEventListener('click', newShift);
  document.getElementById('copy').addEventListener('click', copyResult);
  window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'});
}

function resultText(){
  const r = rankOf();
  const ok = S.log.filter(e => e.q === 'ok').length;
  return 'Первостольник: «' + r.title + '». Выручка ' + rub(S.cash) + ' при плане ' + rub(PLAN) + ', доверие ' + S.trust + '/100, нервы ' + S.nerves + '/100, риск проверки ' + S.risk + '/100. По правилам ' + ok + ' из ' + S.log.length + ' решений. Балл: ' + score() + '.';
}
function copyResult(){
  const btn = document.getElementById('copy');
  const txt = resultText();
  const fallback = () => {
    const ta = document.getElementById('copybox');
    ta.hidden = false; ta.value = txt; ta.focus(); ta.select();
    btn.textContent = 'Выделено, нажмите Ctrl+C';
  };
  try {
    navigator.clipboard.writeText(txt).then(() => { btn.textContent = 'Скопировано'; setTimeout(() => { btn.textContent = 'Скопировать результат'; }, 2000); }, fallback);
  } catch (e) { fallback(); }
}

function footNote(){
  return '<p class="foot">Аптека, персонажи и бренды вымышлены. Справки опираются на действующие нормы РФ: приказы Минздрава № 1094н и № 259н, постановление Правительства № 2463, КоАП. Это игра, а не медицинская или юридическая консультация.</p>';
}

function render(fresh){
  if (!S) return renderStart();
  if (S.phase === 'end') return renderEnd();
  renderGame(fresh);
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !S) return;
  if (S.phase === 'play' && /^[1-3]$/.test(e.key)){
    const ci = S.order[+e.key - 1];
    if (ci !== undefined){ e.preventDefault(); choose(ci); }
  }
});

/* Сохранение партии при обновлении страницы у открытых зрителей */
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({S:S})); } catch (e) {}
function boot(data){ if (data && data.S && data.S.deck) S = data.S; render(); }
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
